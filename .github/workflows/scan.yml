name: FluxOpen · Auditoria autorizada
run-name: FluxOpen ${{ inputs.scan_id }}
on:
  workflow_dispatch:
    inputs:
      payload:
        description: "Manifesto HMAC emitido pelo painel"
        required: true
        type: string
      signature:
        description: "Assinatura do manifesto"
        required: true
        type: string
      scan_id:
        description: "Identificador da auditoria"
        required: true
        type: string
      verification_only:
        description: "Validar integração sem acessar alvos ou executar scanners"
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: fluxopen-scans
  cancel-in-progress: false
jobs:
  authorized_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validar manifesto e executar ferramentas selecionadas
        env:
          SCAN_SIGNING_SECRET: ${{ secrets.SCAN_SIGNING_SECRET }}
          FLUXOPEN_PAYLOAD: ${{ inputs.payload }}
          FLUXOPEN_SIGNATURE: ${{ inputs.signature }}
          FLUXOPEN_SCAN_ID: ${{ inputs.scan_id }}
          FLUXOPEN_VERIFY_ONLY: ${{ inputs.verification_only }}
        run: |
          runner=scanner/runner.py
          if [ "$FLUXOPEN_VERIFY_ONLY" = "true" ]; then runner=scanner/verify_pipeline.py; fi
          python3 "$runner" \
            --payload "$FLUXOPEN_PAYLOAD" \
            --signature "$FLUXOPEN_SIGNATURE" \
            --expected-id "$FLUXOPEN_SCAN_ID" \
            --output "$RUNNER_TEMP/fluxopen"
      - name: Devolver relatório assinado ao painel Cloudflare
        if: always()
        env:
          SCAN_SIGNING_SECRET: ${{ secrets.SCAN_SIGNING_SECRET }}
          FLUXOPEN_CALLBACK_URL: https://fluxopen-security.nutricionistaalmeidavh.workers.dev/api/callback
        run: |
          python3 - <<'PY'
          import hashlib
          import hmac
          import os
          from pathlib import Path
          import urllib.request
          report = Path(os.environ["RUNNER_TEMP"]) / "fluxopen" / "report.json"
          key = os.getenv("SCAN_SIGNING_SECRET", "")
          if not report.is_file() or len(key) < 32:
              print("Sem relatório assinado. Consultar artefatos no workflow.")
          else:
              data = report.read_bytes()
              signature = hmac.new(key.encode(), data, hashlib.sha256).hexdigest()
              request = urllib.request.Request(
                  os.environ["FLUXOPEN_CALLBACK_URL"],
                  data=data,
                  method="POST",
                  headers={"Content-Type":"application/json",
                           "X-FluxOpen-Signature":signature},
              )
              with urllib.request.urlopen(request, timeout=25) as response:
                  print("Callback FluxOpen HTTP", response.status)
          PY
      - name: Arquivar resultados e evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluxopen-${{ inputs.scan_id }}
          path: ${{ runner.temp }}/fluxopen/
          if-no-files-found: warn
          retention-days: 30
