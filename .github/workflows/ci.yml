name: FluxOpen · Verificação
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependências de teste
        run: python3 -m pip install -r app/requirements.txt
      - name: Testes de autorização e assinatura
        run: python3 -m unittest discover -s tests -v
      - name: Sintaxe JavaScript do painel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("app/static/index.html").read_text()
          assert "<script>" in text and "</script>" in text
          Path("/tmp/fluxopen-ui.js").write_text(text.split("<script>",1)[1].split("</script>",1)[0])
          PY
          node --check /tmp/fluxopen-ui.js
      - name: Testes do Cloudflare Worker
        run: node --test tests/test_worker.mjs
      - name: Testes do relatório amigável e HTML seguro
        run: node --test tests/test_friendly_report.mjs tests/test_friendly_ui.mjs
      - name: Exportação HTML legível no celular e nomes de arquivo amigáveis
        run: node --test tests/test_report_export.mjs
      - name: Testes criptográficos WebAuthn e Face ID
        run: node --test tests/test_passkeys.mjs
      - name: Testar recuperação idempotente de auditorias
        run: node --test tests/test_dispatch.mjs
      - name: Testes do motor de relatórios amigáveis
        run: node --test tests/test_friendly_report.mjs
      - name: Validar JavaScript do painel Cloudflare
        run: |
          node --test tests/test_panel_compile.mjs
      - name: Compilação de Python
        run: python3 -m compileall -q security.py app scanner
  scanner_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build scanners auxiliares (checksums verificados)
        run: docker build -t fluxopen/misc:ci -f scanner/Dockerfile.misc .
      - name: Verificar binários sem acessar alvos
        run: |
          docker run --rm fluxopen/misc:ci ffuf -V
          docker run --rm fluxopen/misc:ci feroxbuster --version
          docker run --rm fluxopen/misc:ci python /opt/sqlmap/sqlmap.py --version
