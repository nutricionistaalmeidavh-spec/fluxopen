name: FluxOpen · Verificação
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependências de teste
        run: python3 -m pip install -r app/requirements.txt
      - name: Testes de autorização e assinatura
        run: python3 -m unittest discover -s tests -v
      - name: Sintaxe JavaScript do painel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("app/static/index.html").read_text()
          assert "<script>" in text and "</script>" in text
          Path("/tmp/fluxopen-ui.js").write_text(text.split("<script>",1)[1].split("</script>",1)[0])
          PY
          node --check /tmp/fluxopen-ui.js
      - name: Testes do Cloudflare Worker
        run: node --test tests/test_worker.mjs
      - name: Testes criptográficos WebAuthn e Face ID
        run: node --test tests/test_passkeys.mjs
      - name: Testar recuperação idempotente de auditorias
        run: node --test tests/test_dispatch.mjs
      - name: Compilação de Python
        run: python3 -m compileall -q security.py app scanner
  scanner_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build scanners auxiliares (checksums verificados)
        run: docker build -t fluxopen/misc:ci -f scanner/Dockerfile.misc .
      - name: Verificar binários sem acessar alvos
        run: |
          docker run --rm fluxopen/misc:ci ffuf -V
          docker run --rm fluxopen/misc:ci feroxbuster --version
          docker run --rm fluxopen/misc:ci python /opt/sqlmap/sqlmap.py --version

  callback_probe:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.title, 'callback diagnostic')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Diagnosticar callback Cloudflare sem varredura
        env:
          SCAN_SIGNING_SECRET: ${{ secrets.SCAN_SIGNING_SECRET }}
        run: |
          python3 - <<'PY'
          import hashlib,hmac,json,os,urllib.request,urllib.error
          secret=os.environ.get('SCAN_SIGNING_SECRET','')
          if len(secret)<32:
              raise RuntimeError('Secret SCAN_SIGNING_SECRET ausente/inválido')
          data=json.dumps({
              'id':'eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee',
              'url':'https://artisys.dev/',
              'mode':'passive',
              'status':'failed',
              'modules':[],
              'findings':[]
          },ensure_ascii=False,separators=(',',':')).encode()
          signature=hmac.new(secret.encode(),data,hashlib.sha256).hexdigest()
          req=urllib.request.Request(
              'https://fluxopen-security.nutricionistaalmeidavh.workers.dev/api/callback',
              data=data,method='POST',
              headers={'Content-Type':'application/json','X-FluxOpen-Signature':signature,'User-Agent':'FluxOpen-GitHub-Actions/1.0'})
          try:
              with urllib.request.urlopen(req,timeout=20) as response:
                  print('Status inesperado:',response.status)
                  print('Body:',response.read(350).decode(errors='replace'))
          except urllib.error.HTTPError as e:
              print('Status recebido:',e.code)
              print('Content-Type:',e.headers.get('Content-Type',''))
              print('Server:',e.headers.get('Server',''))
              print('CF-Mitigated:',e.headers.get('cf-mitigated',''))
              print('Resposta:',e.read(450).decode(errors='replace'))
              if e.code==404:
                  print('PROBE_OK: a assinatura foi aceita, scan fictício não existe')
              elif e.code==403:
                  raise RuntimeError('Callback recusado com 403')
              else:
                  raise
          PY
