services:
  panel:
    build:
      context: .
      dockerfile: app/Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DB_PATH: /data/fluxopen.db
      REPORTS_DIR: /data/reports
    volumes:
      - fluxopen_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
volumes:
  fluxopen_data:
